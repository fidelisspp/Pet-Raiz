spring.application.name=service-usuarios

# Porta do serviço (o app Android usa http://10.0.2.2:8081/ para login, /me e cadastro)
server.port=8081

# LOCALE

# Diz ao Spring para usar sempre o locale abaixo, em vez de tentar
# detectar pelo header Accept-Language da requisição
spring.mvc.locale-resolver=fixed
spring.mvc.locale=pt_BR

#MySQL Database Connection Properties
# Banco próprio do serviço: nenhum outro serviço lê estas tabelas
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pet_usuarios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
# O schema do banco é fixo (docs/db/schema-usuarios.sql + alteracoes-etapa2.sql): o Hibernate só valida, nunca altera
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
# Este é o ÚNICO serviço que emite token. O service-produtos e o service-pedidos validam
# com a MESMA secret-key (HS256), então o valor precisa ser igual nos três.
# Validade do token = dias + horas + minutos (somados em JwtUtils.toExpireDate). Hoje: 8 horas.
petraiz.jwt.secret-key=${JWT_SECRET:0123456789-0123456789-0123456789}
petraiz.jwt.expire-days=0
petraiz.jwt.expire-hours=8
petraiz.jwt.expire-minutes=0

# Chamadas entre serviços: rotas /api/v1/interno/** exigem o header X-Internal-Key com este valor.
# O app Android nunca recebe esta chave. Precisa ser igual em quem chama (service-produtos).
petraiz.interno.chave=${INTERNAL_KEY:troque-esta-chave-interna-petraiz}

# Springdoc OpenApi 3.1 & Swagger 3
springdoc.swagger-ui.path=/docs-petraiz.html
springdoc.api-docs.path=/docs-petraiz
springdoc.packagesToScan=com.raizpet.api.web.controller

# Documento do cadastro do produtor (Etapa 5.1): vai para <petraiz.uploads.dir>/documentos/, FORA de src/main/resources.
# Essa pasta NÃO é servida como estático: só o admin baixa, por GET /api/v1/produtores/{id}/documento.
petraiz.uploads.dir=${UPLOADS_DIR:./uploads}
# Qualquer formato, até 5 MB; acima disso o Spring lança MaxUploadSizeExceededException (vira 422 errors.documento)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Deixa o Tomcat ler o corpo inteiro de um upload grande demais, para conseguir devolver o JSON de erro
server.tomcat.max-swallow-size=20MB
