# Perfil de testes: mesmo schema de desenvolvimento, mas no banco pet_produtos_db_test
# (criado com docs/db/schema-produtos.sql + alteracoes-etapa2.sql, ver README)
spring.datasource.url=jdbc:mysql://localhost:3306/pet_produtos_db_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# O service-usuarios de verdade NÃO é usado nos testes: IntegracaoBase sobe um stub HTTP
# (UsuariosStub) numa porta livre e sobrescreve petraiz.usuarios.url. Timeouts curtos.
petraiz.usuarios.connect-timeout-ms=500
petraiz.usuarios.read-timeout-ms=1000

# Uploads dos testes ficam em target/ (apagado pelo mvn clean), nunca na pasta real
petraiz.uploads.dir=target/test-uploads
