spring.application.name=service-produtos

# Porta do serviço (o app Android usa http://10.0.2.2:8080/ para o catálogo e as imagens)
server.port=8080

# LOCALE

# Diz ao Spring para usar sempre o locale abaixo, em vez de tentar
# detectar pelo header Accept-Language da requisição
spring.mvc.locale-resolver=fixed
spring.mvc.locale=pt_BR

#MySQL Database Connection Properties
# Banco próprio do serviço: nenhum outro serviço lê estas tabelas
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pet_produtos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
# O schema do banco é fixo (docs/db/schema-produtos.sql + alteracoes-etapa2.sql): o Hibernate só valida, nunca altera
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
# Este serviço NÃO emite token: só valida o token do service-usuarios com a MESMA secret-key (HS256)
# e lê as claims id e role. O valor precisa ser igual nos três serviços.
petraiz.jwt.secret-key=${JWT_SECRET:0123456789-0123456789-0123456789}

# Chamadas entre serviços (header X-Internal-Key).
# - Rotas /api/v1/interno/** DESTE serviço (chamadas pelo service-pedidos) exigem esta chave.
# - A MESMA chave vai no header quando este serviço chama o service-usuarios.
petraiz.interno.chave=${INTERNAL_KEY:troque-esta-chave-interna-petraiz}

# service-usuarios: de onde vêm os produtores aprovados (filtro do catálogo e companyName)
petraiz.usuarios.url=${USUARIOS_URL:http://localhost:8081}
# Tempo máximo das chamadas ao service-usuarios (ms). Estourou ou deu erro: o catálogo responde 503.
petraiz.usuarios.connect-timeout-ms=2000
petraiz.usuarios.read-timeout-ms=3000

# Springdoc OpenApi 3.1 & Swagger 3
springdoc.swagger-ui.path=/docs-petraiz.html
springdoc.api-docs.path=/docs-petraiz
springdoc.packagesToScan=com.raizpet.api.web.controller
