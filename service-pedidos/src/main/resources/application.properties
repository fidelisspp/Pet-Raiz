spring.application.name=service-pedidos

# Porta do serviço (o app Android usa http://10.0.2.2:8082/ para carrinho, endereços e pedidos)
server.port=8082

# LOCALE

# Diz ao Spring para usar sempre o locale abaixo, em vez de tentar
# detectar pelo header Accept-Language da requisição
spring.mvc.locale-resolver=fixed
spring.mvc.locale=pt_BR

#MySQL Database Connection Properties
# Banco próprio do serviço: nenhum outro serviço lê estas tabelas
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pet_pedidos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
# O schema do banco é fixo (docs/db/schema-pedidos.sql + alteracoes-etapa2.sql): o Hibernate só valida, nunca altera
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Pedido -> grupos por produtor -> itens: carrega as coleções em lotes (evita uma consulta por grupo no histórico)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT
# Este serviço NÃO emite token: só valida o token do service-usuarios com a MESMA secret-key (HS256)
# e lê as claims id, sub (e-mail) e role. O valor precisa ser igual nos três serviços.
petraiz.jwt.secret-key=${JWT_SECRET:0123456789-0123456789-0123456789}

# Chamadas entre serviços (header X-Internal-Key).
# - A MESMA chave vai no header quando este serviço chama o service-produtos e o service-usuarios.
# - Rotas /api/v1/interno/** DESTE serviço (nenhuma por enquanto) exigiriam esta chave.
petraiz.interno.chave=${INTERNAL_KEY:troque-esta-chave-interna-petraiz}

# service-produtos: dados dos produtos do carrinho, reserva e estorno de estoque
petraiz.produtos.url=${PRODUTOS_URL:http://localhost:8080}
petraiz.produtos.connect-timeout-ms=2000
petraiz.produtos.read-timeout-ms=5000

# service-usuarios: confere no checkout se o cliente está suspenso
petraiz.usuarios.url=${USUARIOS_URL:http://localhost:8081}
petraiz.usuarios.connect-timeout-ms=2000
petraiz.usuarios.read-timeout-ms=3000

# Springdoc OpenApi 3.1 & Swagger 3
springdoc.swagger-ui.path=/docs-petraiz.html
springdoc.api-docs.path=/docs-petraiz
springdoc.packagesToScan=com.raizpet.api.web.controller
