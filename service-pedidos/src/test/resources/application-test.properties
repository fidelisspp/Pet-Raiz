# Perfil de testes: mesmo schema de desenvolvimento, mas no banco pet_pedidos_db_test
# (criado com docs/db/schema-pedidos.sql + alteracoes-etapa2.sql, ver README)
spring.datasource.url=jdbc:mysql://localhost:3306/pet_pedidos_db_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# O service-produtos e o service-usuarios de verdade NÃO são usados nos testes: IntegracaoBase sobe
# stubs HTTP (ProdutosStub e UsuariosStub) em portas livres e sobrescreve as URLs. Timeouts curtos.
petraiz.produtos.connect-timeout-ms=500
petraiz.produtos.read-timeout-ms=1000
petraiz.usuarios.connect-timeout-ms=500
petraiz.usuarios.read-timeout-ms=1000
